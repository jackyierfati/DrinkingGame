<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>🍻 喝酒转盘 DrinkingGame</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🍻 喝酒转盘</h1>
    <p class="subtitle">转到谁，谁就按条件喝 · 优先级防重复</p>
  </header>

  <main>
    <div class="controls">
      <select id="category" aria-label="分类"></select>
      <button id="reset" class="ghost">重置这一局</button>
    </div>

    <div class="wheel-wrap">
      <div class="pointer">▼</div>
      <canvas id="wheel" width="360" height="360"></canvas>
    </div>

    <button id="spin" class="primary">转 起 来</button>

    <div class="result-card">
      <div id="result-cat" class="cat"></div>
      <div id="result" class="result">点「转起来」开始</div>
    </div>

    <p id="stats" class="stats"></p>
  </main>

  <footer>
    <p>词条越新（没出现过）越容易被转到，出现过就往后排，尽量不重复。</p>
  </footer>

  <script src="js/entries-data.js"></script>
  <script src="js/entries.js"></script>
  <script src="js/db.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
