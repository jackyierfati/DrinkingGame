<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🍻 喝酒游戏合集</title>
  <style>
    :root {
      --bg: #12101c; --card: #1e1b2e; --accent: #ff5c8a; --accent2: #7c5cff;
      --text: #f5f3ff; --muted: #a8a3c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(120% 100% at 50% 0%, #241f3a 0%, var(--bg) 60%);
      color: var(--text);
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 16px 48px;
    }
    header { text-align: center; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 30px; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .games {
      width: 100%; max-width: 520px;
      display: grid; grid-template-columns: 1fr; gap: 16px;
    }
    .game-card {
      display: flex; align-items: center; gap: 16px;
      background: var(--card); border: 1px solid #322c4d;
      border-radius: 18px; padding: 20px;
      color: var(--text); text-decoration: none;
      transition: transform 0.12s, border-color 0.2s;
    }
    .game-card:active { transform: scale(0.98); }
    .game-card:hover { border-color: var(--accent2); }
    .game-emoji {
      font-size: 40px; flex: 0 0 auto;
      width: 64px; height: 64px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(255,92,138,0.2), rgba(124,92,255,0.2));
    }
    .game-info { flex: 1; }
    .game-name { font-size: 20px; font-weight: 700; }
    .game-desc { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.4; }
    .game-arrow { color: var(--muted); font-size: 22px; }
    .game-card.soon { opacity: 0.5; pointer-events: none; }
    .soon-tag {
      font-size: 11px; color: var(--accent); border: 1px solid var(--accent);
      border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: middle;
    }
    footer { color: var(--muted); font-size: 12px; margin-top: 32px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>🍻 喝酒游戏合集</h1>
    <p class="subtitle">选一个游戏，开喝！</p>
  </header>

  <div class="games">
    <a class="game-card" href="games/wheel/index.html">
      <div class="game-emoji">🎡</div>
      <div class="game-info">
        <div class="game-name">喝酒转盘</div>
        <div class="game-desc">转到词条，符合条件的人喝。两种模式 + 防重复 + 可自定义词条。</div>
      </div>
      <div class="game-arrow">›</div>
    </a>

    <a class="game-card" href="games/misscard/index.html">
      <div class="game-emoji">🃏</div>
      <div class="game-info">
        <div class="game-name">小姐牌</div>
        <div class="game-desc">扑克牌喝酒游戏。抽牌触发效果——挡酒、小姐、跳7、公杯……主持人发牌，全场围观。</div>
      </div>
      <div class="game-arrow">›</div>
    </a>

    <a class="game-card" href="games/ridebus/index.html">
      <div class="game-emoji">🚌</div>
      <div class="game-info">
        <div class="game-name">开Bus</div>
        <div class="game-desc">Ride the Bus 三环节：猜牌建筹码 → 牌阵打牌 → 输家开Bus。App 自动发牌判定。</div>
      </div>
      <div class="game-arrow">›</div>
    </a>

    <div class="game-card soon">
      <div class="game-emoji">➕</div>
      <div class="game-info">
        <div class="game-name">更多游戏<span class="soon-tag">敬请期待</span></div>
        <div class="game-desc">你脑子里那些喝酒游戏，一个个加进来。</div>
      </div>
      <div class="game-arrow">›</div>
    </div>
  </div>

  <footer>未成年人禁止饮酒 · 适量饮酒，理性娱乐</footer>
</body>
</html>
