<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>🃏 小姐牌</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topnav">
    <a href="../../index.html" class="nav-btn">‹ 大厅</a>
    <span class="nav-title">🃏 小姐牌</span>
    <button id="restart" class="nav-btn">重开</button>
  </div>

  <!-- 设置：人数 + 名字 -->
  <section id="setup" class="screen">
    <h2>谁来玩？</h2>
    <div class="count-row">
      <button id="count-minus" class="count-btn">−</button>
      <span id="count-num">4</span>
      <button id="count-plus" class="count-btn">＋</button>
      <span class="count-label">人</span>
    </div>
    <div id="name-inputs" class="name-inputs"></div>
    <p class="hint">按入座顺序填名字（围成一圈：上一个＝左边，下一个＝右边）</p>
    <button id="start-game" class="primary">开始游戏</button>
  </section>

  <!-- 游戏（圆桌） -->
  <section id="game" class="screen hidden">
    <div class="turn-hint" id="turn-hint">轮到 <b>—</b> 摸牌</div>

    <div class="table" id="table">
      <div class="table-center">
        <div class="cup-mini" id="cup-mini">🍶 出K 0/4</div>
        <div class="playing-card" id="card">
          <span class="card-rank" id="card-rank">🃏</span>
        </div>
        <div class="card-title" id="card-title">点「摸牌」开始</div>
      </div>
      <!-- 座位由 JS 注入 -->
    </div>

    <div class="prompt" id="prompt"></div>

    <div class="action-row">
      <button id="draw" class="primary">摸 牌</button>
      <button id="camera-timer" class="ghost">📸 10秒</button>
      <button id="clear-neuro" class="ghost hidden">解除神经病</button>
    </div>
    <button id="reshuffle" class="primary hidden">🔀 洗牌重来</button>
    <div class="tip">点座位上的玩家可使用手牌（挡酒 / 厕所 等）</div>
  </section>

  <!-- 手牌使用面板 -->
  <div id="hand-sheet" class="hand-sheet hidden">
    <div class="hand-sheet-panel">
      <div class="hand-sheet-title" id="hand-sheet-title">手牌</div>
      <div id="hand-sheet-list"></div>
      <button id="hand-sheet-close" class="ghost">关闭</button>
    </div>
  </div>

  <!-- 特殊事件飘字（吐槽/下岗/老鸨） -->
  <div id="toast" class="toast hidden"></div>

  <!-- 照相机倒计时遮罩 -->
  <div id="countdown" class="countdown hidden"><span id="countdown-num">10</span></div>

  <script src="js/misscard.js"></script>
</body>
</html>
